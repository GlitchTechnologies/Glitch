name: glitch_ringtone
description: Звук и вибрация входящего вызова Glitch — нативная часть, доступная и фоновому коду.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # Только Android: приложение и так собирается только под него.
      android:
        package: com.glitch.ringtone
        pluginClass: GlitchRingtonePlugin
