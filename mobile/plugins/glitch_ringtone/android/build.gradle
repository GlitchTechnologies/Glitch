group 'com.glitch.ringtone'
version '1.0'

buildscript {
    ext.kotlin_version = '2.2.20'   // как в android/settings.gradle
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.3'   // как в android/settings.gradle
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.glitch.ringtone'
    compileSdk 36                    // как в android/app/build.gradle

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk 24                    // как в android/app/build.gradle
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'
}
